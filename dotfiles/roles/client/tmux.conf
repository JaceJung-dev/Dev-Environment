# 클라이언트(맥북) 전용 tmux 설정 — tpm 실행 전에 source 된다.

set -g @themepack "powerline/default/yellow"

# Nested tmux: 서버 tmux 에 SSH 로 붙었을 때 F12 로 바깥(로컬) tmux 의 키 입력을 끄고 켠다.
# OFF 상태에서는 prefix 와 Ctrl-hjkl 이 모두 안쪽(서버) tmux 로 전달되고, 상태바가 회색이 된다.
bind -T root F12 \
  set prefix None \; \
  set prefix2 None \; \
  set key-table off \; \
  set status-style "fg=colour245,bg=colour238" \; \
  if -F "#{pane_in_mode}" "send-keys -X cancel" \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u prefix2 \; \
  set -u key-table \; \
  set -u status-style \; \
  refresh-client -S
