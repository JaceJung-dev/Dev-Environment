# 서버(맥미니) 전용 tmux 설정 — tpm 실행 전에 source 된다.

# 상태바를 파란색으로 (클라이언트는 노란색)
set -g @themepack "powerline/default/blue"
# themepack 미설치 시에도 서버임을 알 수 있게 하는 fallback (themepack 이 로드되면 덮어씀)
set -g status-style "bg=blue,fg=#ffffff"

# 터미널(바깥) 탭/창 제목에 호스트 이름 표시
set -g set-titles on
set -g set-titles-string "󰒋 #h · #S"
