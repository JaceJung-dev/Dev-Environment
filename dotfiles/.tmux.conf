set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Extended keys (CSI-u) - Shift+Enter 같은 modifier 조합을 앱으로 그대로 전달
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Clipboard - OSC 52로 시스템 클립보드 동기화
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'
set -g allow-passthrough on

# setting for claude code
set -g focus-events on

# add addtional prefix (Ctrl + a) / default: Ctrl + b
set -g prefix2 C-a
bind-key C-a send-prefix

# Reload tmux config
bind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Key Bindings for resizing pane
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Toggle pane zoom
bind -r m resize-pane -Z

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Copy mode (Vi-style setting)
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# Don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane 

# tpm plugin
set -g @plugin "tmux-plugins/tpm"

# list of tmux plugins
set -g @plugin "christoomey/vim-tmux-navigator" # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin "jimeh/tmux-themepack" # to configure tmux theme
set -g @plugin "tmux-plugins/tmux-resurrect" # persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" # automatically saves sessions for you every 15 minutes

set -g @themepack "powerline/default/yellow" # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'off' # enable tmux-continuum functionality

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"

# claude-chatlog 도 vim처럼 취급해 Ctrl-hjkl 을 앱으로 전달
bind -n C-h if-shell -F "#{m/ri:^(view|l?n?vim?x?|fzf|claude-chatlog)$,#{pane_current_command}}" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F "#{m/ri:^(view|l?n?vim?x?|fzf|claude-chatlog)$,#{pane_current_command}}" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F "#{m/ri:^(view|l?n?vim?x?|fzf|claude-chatlog)$,#{pane_current_command}}" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F "#{m/ri:^(view|l?n?vim?x?|fzf|claude-chatlog)$,#{pane_current_command}}" "send-keys C-l" "select-pane -R"
